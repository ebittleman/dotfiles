# ==========================================================
# abcde.conf — FLAC ripping for Plex, correctness-first
# Layout:
#   "Artist - Album (YYYY)/Disc N/01 - Title.flac"
#
# Key points:
# - NO abcde getalbumart/embedalbumart actions (prevents ImageMagick `display` GUI)
# - Year suffix comes from MusicBrainz YEAR variable, embedded directly in OUTPUTFORMAT
# - Cover is fetched + normalized + embedded via metaflac (no GUI)
# ==========================================================

echo "### USING ~/.abcde.conf ###" >&2

# Hard-disable GUI previews
unset DISPLAY

# ==========================================================
# USER LIBRARY ROOT
# ==========================================================
LIBRARY_ROOT="$HOME/Music/RIPS"

# ==========================================================
# DEVICE / SECURE RIPPING
# ==========================================================
CDROM=/dev/cdrom
CDPARANOIA_OPTS='-d %d -z'
OUTPUTTYPE=flac
FLACOPTS='-8 --verify'

# ==========================================================
# METADATA (MusicBrainz)
# ==========================================================
CDDBMETHOD=musicbrainz

# ==========================================================
# GENERAL
# ==========================================================
WRITEINFO=y
CUE=y
EXTRAVERBOSE=y
KEEPWAVS=n
PADTRACKS=y
NOPROMPT=n  # keep MusicBrainz selection interactive

# ==========================================================
# ABSOLUTE: disable abcde album art actions/flags
# ==========================================================
GETALBUMART=n
EMBEDALBUMART=n

# Explicit action list (no default, no getalbumart, no embedalbumart)
ACTIONS=cddb,read,encode,tag,move,clean

# ==========================================================
# FILESYSTEM SANITIZATION
# ==========================================================
MAXNAME=240
mungefilename () {
  echo "$@" | tr '/' '-' | sed 's/[?<>\\:*|"]/ /g'
}

# ==========================================================
# OUTPUT ROOT
# ==========================================================
OUTPUTDIR="$LIBRARY_ROOT"

# ==========================================================
# FILE NAMING
# abcde variables: ARTISTFILE, ALBUMFILE, TRACKFILE, TRACKNUM, DISCNUMBER
# DISCNUMBER conditional: empty for single-disc, "/Disc N" for multi-disc
# ==========================================================
OUTPUTFORMAT='${ARTISTFILE} - ${ALBUMFILE}${YEAR:+ (${YEAR})}${DISCNUMBER:+/Disc ${DISCNUMBER}}/${TRACKNUM} - ${TRACKFILE}'
VAOUTPUTFORMAT='${ARTISTFILE} - ${ALBUMFILE}${YEAR:+ (${YEAR})}${DISCNUMBER:+/Disc ${DISCNUMBER}}/${TRACKNUM} - ${TRACKFILE}'

# ==========================================================
# POST-ENCODE: called by abcde once after all tracks are encoded/tagged/moved.
# DARTIST, DALBUM, MBID, OUTPUTDIR are all set in the main abcde shell.
# ==========================================================
post_encode () {
  # Reconstruct the album dir path the same way abcde did for OUTPUTFORMAT
  local artistfile albumfile
  artistfile="$(mungeartistname "$DARTIST")"
  albumfile="$(mungealbumname "$DALBUM")"

  # Match the OUTPUTFORMAT year conditional.
  # YEAR is only set inside do_move subshells; use CDYEAR which is set in the main shell.
  local albumdir
  albumdir="$OUTPUTDIR/${artistfile} - ${albumfile}${CDYEAR:+ (${CDYEAR})}"
  [ -d "$albumdir" ] || return 0

  # MBID is only set inside do_getalbumart which we don't run — read it directly
  # from abcde's temp dir, the same way do_getalbumart does
  if [ -z "$MBID" ] && [ -n "$ABCDETEMPDIR" ]; then
    local choice
    choice="$(checkstatus cddb-choice)"
    [ -n "$choice" ] && MBID="$(cat "${ABCDETEMPDIR}/mbid.${choice}" 2>/dev/null)"
  fi

  # ---- Cover fetch + normalize ----
  local cover="$albumdir/cover.jpg"
  local norm="$albumdir/cover.norm.jpg"

  if [ ! -s "$cover" ] && [ -n "$MBID" ]; then
    curl -fsSL -o "$cover" "https://coverartarchive.org/release/${MBID}/front" >/dev/null 2>&1 || true
  fi

  if [ -s "$cover" ]; then
    convert "$cover" \
      -resize '1500x1500>' \
      -strip \
      -interlace Plane \
      -sampling-factor 4:2:0 \
      -quality 88 \
      "JPEG:$norm" </dev/null >/dev/null 2>&1 \
      && mv -f "$norm" "$cover"
    cp -f "$cover" "$albumdir/folder.jpg" 2>/dev/null || true
  fi

  # ---- Embed into every FLAC under albumdir (including Disc N subdirs) ----
  if [ -s "$cover" ]; then
    find "$albumdir" -type f -name '*.flac' -print0 2>/dev/null \
      | while IFS= read -r -d '' f2; do
          metaflac --remove --block-type=PICTURE "$f2" >/dev/null 2>&1 || true
          metaflac --import-picture-from="$cover" "$f2" >/dev/null 2>&1 || true
        done
  fi
}

